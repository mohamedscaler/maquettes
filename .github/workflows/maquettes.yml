# À chaque nouvelle fiche prospect : génère la maquette (photos téléchargées une fois),
# l'enregistre dans le repo, puis publie le site sur GitHub Pages.
name: Maquettes

on:
  push:
    branches: [main]
    paths: ["prospects/**", "modele/**", "outils/**", ".github/workflows/maquettes.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: maquettes
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les maquettes
        run: python outils/generer.py

      - name: Enregistrer les maquettes générées
        run: |
          git config user.name "maquettes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Maquettes générées"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
